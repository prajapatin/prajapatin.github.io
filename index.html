  <!-- Back to top button -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <i class="icon icon-circle-up"></i>
  </button>

  <script>
  // Back to top
  (function() {
    var btn = document.getElementById('backToTop');
    if (!btn) return;

    window.addEventListener('scroll', function() {
      if (window.scrollY > 400) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });

    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();

  // Fade-in on scroll
  (function() {
    var els = document.querySelectorAll('.post, .card, .page');
    if (!els.length) return;

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('fade-in');
          entry.target.style.opacity = '';
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.05 });

    els.forEach(function(el) {
      var rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight) {
        // Already in viewport — show immediately
        el.classList.add('fade-in');
      } else {
        el.style.opacity = '0';
        observer.observe(el);
      }
    });
  })();
  </script>

  <!-- Lightbox overlay for zoomable images -->
  <style>
    #imageLightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      cursor: zoom-out;
    }
    #imageLightbox.active {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #imageLightbox img {
      max-width: 92vw !important;
      max-height: 92vh !important;
      width: auto !important;
      height: auto !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5) !important;
      margin: 0 !important;
      border: none !important;
      display: block !important;
      background: transparent !important;
      transform: none !important;
    }
  </style>
  <div id="imageLightbox"></div>
  <script>
  (function() {
    var overlay = document.getElementById('imageLightbox');
    if (!overlay) return;

    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouch) return;

    document.querySelectorAll('.post-content img').forEach(function(img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var newImg = document.createElement('img');
        newImg.src = this.src;
        newImg.alt = this.alt;
        overlay.innerHTML = '';
        overlay.appendChild(newImg);
        overlay.classList.add('active');
      });
    });

    overlay.addEventListener('click', function() {
      overlay.classList.remove('active');
      overlay.innerHTML = '';
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        overlay.classList.remove('active');
        overlay.innerHTML = '';
      }
    });
  })();
  </script>
